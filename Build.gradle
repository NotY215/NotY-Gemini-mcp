plugins {
    id 'java'
    id 'application'
}

group 'com.noty'
version '1.0.0'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.google.code.gson:gson:2.10.1'
}

application {
    mainClass = 'com.noty.geminimcp.MainApp'
}

jar {
    manifest {
        attributes 'Main-Class': 'com.noty.geminimcp.MainApp'
    }
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}