plugins {
    id 'java'
}

group 'com.noty'
version '1.0.0'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.google.code.gson:gson:2.10.1'
}

// Set source directories
sourceSets {
    main {
        java {
            srcDirs = ['src/java']
        }
        resources {
            srcDirs = ['resources']
        }
    }
}

// Build JAR for UI
jar {
    manifest {
        attributes 'Main-Class': 'com.noty.geminimcp.MainApp'
    }
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    from('resources') {
        into ''
        include '**/*.png', '**/*.jpg', '**/*.ico'
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}